# MealSwipe — production-style stack (self-hosted).
# Copy .env.example to .env, set POSTGRES_PASSWORD, then: docker compose up -d --build
# PostgreSQL is NOT published on the host; only the frontend port is exposed.

services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-mealswipe}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: ${POSTGRES_DB:-mealswipe}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 20
    networks: [internal]

  backend:
    build: ./backend
    restart: unless-stopped
    environment:
      APP_NAME: ${APP_NAME:-MealSwipe}
      DATABASE_URL: postgres://${POSTGRES_USER:-mealswipe}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-mealswipe}?sslmode=disable
      HTTP_ADDR: :8080
      COOKIE_SECURE: ${COOKIE_SECURE:-false}
      SESSION_TTL_HOURS: ${SESSION_TTL_HOURS:-720}
      SEED_ON_START: ${SEED_ON_START:-true}
      ALLOWED_ORIGINS: ${ALLOWED_ORIGINS:-}
      LOG_LEVEL: ${LOG_LEVEL:-info}
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:8080/api/v1/health >/dev/null 2>&1 || exit 1"]
      interval: 15s
      timeout: 3s
      retries: 10
      start_period: 10s
    networks: [internal]

  frontend:
    build:
      context: ./frontend
      args:
        VITE_APP_NAME: ${APP_NAME:-MealSwipe}
    restart: unless-stopped
    ports:
      - "${APP_PORT:-8080}:8080"
    depends_on:
      backend:
        condition: service_healthy
    networks: [internal]

networks:
  internal:

volumes:
  pgdata:
